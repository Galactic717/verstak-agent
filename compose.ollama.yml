services:
  worker:
    environment:
      VERSTAK_LLM_PROVIDER: ollama
      VERSTAK_LLM_URL: http://ollama:11434/api/chat
      VERSTAK_LLM_MODEL: ${VERSTAK_OLLAMA_MODEL:-qwen3:4b-q4_K_M}
      VERSTAK_LLM_TIMEOUT_SECONDS: ${VERSTAK_LLM_TIMEOUT_SECONDS:-180}
    depends_on:
      ollama-model:
        condition: service_completed_successfully
  ollama:
    image: ollama/ollama:0.40.18
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 20
  ollama-model:
    image: ollama/ollama:0.40.18
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama"]
    command: ["pull", "${VERSTAK_OLLAMA_MODEL:-qwen3:4b-q4_K_M}"]
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama-data:

[project]
name = "verstak-agent"
version = "0.1.0"
description = "Durable business workflow and MCP control plane"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.15,<2",
    "celery[redis]>=5.5,<6",
    "defusedxml>=0.7,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langgraph>=1,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "mcp>=1.20,<2",
    "openpyxl>=3.1,<4",
    "opentelemetry-instrumentation-fastapi>=0.57b0,<1",
    "pandas>=2.2,<4",
    "prometheus-client>=0.22,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "pyjwt>=2.10,<3",
    "pypdf>=6,<7",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.16,<3",
    "pytest>=8,<9",
    "pytest-asyncio>=1,<2",
    "pytest-bdd>=8,<9",
    "pytest-cov>=6,<8",
    "pytest-playwright>=0.7,<1",
    "ruff>=0.12,<1",
]

[project.scripts]
verstak-mcp = "verstak.mcp_server:main"
verstak-eval = "verstak.llm.evals:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verstak"]

[tool.hatch.build.targets.wheel.force-include]
"evals/goldens.json" = "verstak/llm/goldens.json"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: requires an explicitly configured PostgreSQL instance",
    "chaos: failure-injection and recovery tests",
    "e2e: requires the running Compose stack",
]

# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: verstak-agent-demo-api
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: "off"
    dockerfilePath: ./Dockerfile
    preDeployCommand: alembic upgrade head
    dockerCommand: >-
      /bin/sh -ec 'exec uvicorn verstak.api:app --host 0.0.0.0 --port "${PORT:-10000}"'
    healthCheckPath: /healthz
    envVars:
      - key: VERSTAK_DATABASE_URL
        fromDatabase:
          name: verstak-agent-demo-db
          property: connectionString
      - key: VERSTAK_REDIS_URL
        fromService:
          name: verstak-agent-demo-redis
          type: keyvalue
          property: connectionString
      - key: VERSTAK_JWT_SECRET
        generateValue: true
      - key: VERSTAK_CLIENTS_JSON
        sync: false
      - key: VERSTAK_METRICS_TOKEN
        generateValue: true

  - type: worker
    name: verstak-agent-demo-worker
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: "off"
    dockerfilePath: ./Dockerfile
    preDeployCommand: alembic upgrade head
    dockerCommand: celery -A verstak.workers:app worker --pool=solo -l INFO
    maxShutdownDelaySeconds: 120
    envVars:
      - key: VERSTAK_DATABASE_URL
        fromDatabase:
          name: verstak-agent-demo-db
          property: connectionString
      - key: VERSTAK_REDIS_URL
        fromService:
          name: verstak-agent-demo-redis
          type: keyvalue
          property: connectionString
      - key: VERSTAK_LLM_PROVIDER
        value: fixture

  - type: worker
    name: verstak-agent-demo-beat
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: "off"
    dockerfilePath: ./Dockerfile
    preDeployCommand: alembic upgrade head
    dockerCommand: celery -A verstak.workers:app beat --schedule /tmp/celerybeat-schedule -l INFO
    envVars:
      - key: VERSTAK_DATABASE_URL
        fromDatabase:
          name: verstak-agent-demo-db
          property: connectionString
      - key: VERSTAK_REDIS_URL
        fromService:
          name: verstak-agent-demo-redis
          type: keyvalue
          property: connectionString

  - type: keyvalue
    name: verstak-agent-demo-redis
    region: frankfurt
    plan: 256mb
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

databases:
  - name: verstak-agent-demo-db
    databaseName: verstak
    user: verstak
    postgresMajorVersion: "16"
    region: frankfurt
    plan: 0.1c-256mb
    diskSizeGB: 1
    connectionPool: none
    ipAllowList: []
